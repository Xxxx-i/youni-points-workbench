<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>由你榜囤分工作台</title><style>:root{--ink:#123e33;--deep:#0c382d;--green:#1f5a47;--mint:#dff0e7;--line:#dfe8e3;--paper:#f4f7f3;--muted:#6c817a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#10241e;font:16px/1.45 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:640px;margin:auto;padding:28px 20px 112px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.ey{font-size:12px;letter-spacing:.16em;color:#66877e;margin:0 0 3px}.top h1{font-size:28px;line-height:1.1;margin:0;font-weight:500}.date{border:1px solid #d8e2dd;border-radius:24px;padding:10px 14px;background:#fff;color:#45655b;font-weight:600}.goal{background:linear-gradient(145deg,#18513f,#073328);color:#fff;border-radius:38px;padding:30px 30px 28px;box-shadow:0 18px 35px #153f3020}.goal-title{font-size:20px;font-weight:700;color:#e6f3ed}.goal-line{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.big{font-size:46px;font-weight:700;letter-spacing:-.04em}.big small{font-size:21px;font-weight:400;color:#b9d0c7}.ring{width:98px;height:98px;border:1.5px solid #e8f4ef;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#225a47 0 58%,transparent 59%)}.ring span{font-size:20px;font-weight:700}.bar{height:8px;background:#477265;border-radius:8px;overflow:hidden;margin:16px 0 27px}.bar i{display:block;height:100%;background:#e8f4ef;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #ffffff2b;padding-top:20px;text-align:left}.stats>div+div{border-left:1px solid #ffffff2b;padding-left:22px}.stats b{display:block;font-size:29px}.stats span{color:#b7d0c7}.tip{margin-top:22px;background:#20553a;border-radius:17px;padding:12px 16px;color:#d8f36f}.section-head{display:flex;justify-content:space-between;align-items:end;margin:32px 4px 12px}.section-head p{margin:0;color:#71877f}.section-head h2{font-size:22px;font-weight:500;margin:3px 0}.swap{border:0;background:none;color:#23473c;font-size:16px}.acct{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px 20px;margin:14px 0;box-shadow:0 5px 14px #24483a0b}.acct-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.num{background:#e4f2eb;color:#16634d;border-radius:15px;padding:8px 11px;font-weight:700}.name{flex:1;font-size:20px}.name small{display:block;font-size:13px;color:var(--muted);font-weight:400}.pill{font-size:14px;color:#23704e;background:#dff2e6;border-radius:18px;padding:7px 11px;font-weight:700}.platform{width:100%;display:flex;align-items:center;gap:10px;border:1px solid #e1eae5;background:#f9fbfa;border-radius:18px;padding:13px 14px;margin:8px 0;text-align:left;font:inherit;color:#152c25}.platform .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700}.qq{background:#13ae68}.kg{background:#ec783c}.kw{background:#4b91c5}.platform .label{flex:1;font-weight:650}.platform b{color:#5b736a;font-weight:500}.platform em{font-style:normal;color:#25834e;font-size:22px}.platform:disabled{opacity:.65}.btn{border:0;border-radius:13px;padding:11px 14px;background:var(--ink);color:#fff;font:inherit}.outline{background:#fff;color:var(--ink);border:1px solid #cfded7}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(640px,100%);display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fffffff2;border:1px solid #dbe5df;border-radius:28px 28px 0 0;backdrop-filter:blur(14px)}.nav button{flex:1;border:0;background:none;border-radius:24px;padding:11px 8px;color:#7b8b85;font:inherit}.nav button.active{background:#0e4234;color:#fff}.field{display:block;margin:15px 0;color:#4f6a61}.field span{display:block;font-size:14px;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d7e1dc;border-radius:12px;font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;margin:14px 0}.muted{color:var(--muted);font-size:13px}</style><main><header class=top><div><p class=ey>YOU CHART · DAILY</p><h1>由你榜囤分</h1></div><div class=date id=today></div></header><div id=app></div></main><nav class=nav><button data-tab=today class=active>☷<br>今天</button><button data-tab=accounts>♙<br>账号</button><button data-tab=settings>☷<br>设置</button></nav><script>const K='youni-v6',P=[['qq','QQ音乐','Q'],['kg','酷狗音乐','狗'],['kw','酷我音乐','我']],day=()=>new Date().toISOString().slice(0,10),fmt=x=>{let d=new Date(x+'T00:00:00');return d.getMonth()+1+'月'+d.getDate()+'日';};let D=JSON.parse(localStorage[K]||localStorage['youni-v5']||'null')||{count:18,deadline:'2026-10-18',target:128,daily:14,a:[],h:[]},tab='today';function save(){localStorage[K]=JSON.stringify(D)}function init(){while(D.a.length<D.count){let i=D.a.length+1;D.a.push({id:i,name:'账号 '+i,password:'',s:{qq:0,kg:0,kw:0}})}D.a=D.a.slice(0,D.count);save()}init();function left(){return Math.max(1,Math.ceil((new Date(D.deadline)-new Date(day()))/864e5)+1)}function done(i,k){return D.h.some(x=>x.d===day()&&x.i===i&&x.k===k)}function rec(i,k){if(done(i,k)||D.a[i].s[k]>=D.target)return;D.a[i].s[k]=Math.min(D.target,D.a[i].s[k]+D.daily);D.h.push({d:day(),i,k,v:D.daily});save();render()}function edit(i){let a=D.a[i],n=prompt('修改账号名称',a.name);if(n===null)return;let p=prompt('保存账号密码（仅本机）',a.password||'');if(p===null)return;a.name=n.trim()||a.name;a.password=p;save();render()}function totals(){let goal=D.count*3*D.target,e=D.a.reduce((n,a)=>n+P.reduce((m,[k])=>m+Math.min(a.s[k],D.target),0),0),q=D.a.filter(a=>P.every(([k])=>a.s[k]>=D.target)).length;return{goal,e,q,p:goal?Math.round(e/goal*100):0}}function render(){let t=totals(),h='';if(tab==='today'){h+=`<section class=goal><div class=goal-title>✧ ${fmt(D.deadline)} 白金单曲目标</div><div class=goal-line><div class=big>${t.e.toLocaleString()} <small>/ ${t.goal.toLocaleString()} 分</small></div><div class=ring><span>${t.p}%</span></div></div><div class=bar><i style="width:${t.p}%"></i></div><div class=stats><div><b>${left()}</b><span>剩余天数</span></div><div><b>${t.q}/${D.count}</b><span>达标账号</span></div><div><b>${Math.max(1,Math.ceil((D.count-t.q)/left()))}</b><span>每日建议</span></div></div><div class=tip>◉　按每天 ${Math.max(1,D.daily/1)} 分完成，可在截止日前完成</div></section><div class=section-head><div><p>今天的轮换</p><h2>已完成 ${D.a.filter((a,i)=>P.every(([k])=>done(i,k)||a.s[k]>=D.target)).length} / ${D.count} 个账号</h2></div><button class=swap onclick="render()">⟳ 换一组</button></div>`;D.a.forEach((a,i)=>{let z=P.filter(([k])=>done(i,k)||a.s[k]>=D.target).length;h+=`<article class=acct><div class=acct-top><span class=num>${String(a.id).padStart(2,'0')}</span><span class=name>${a.name}<small>${a.password?'密码已保存':'未填写密码'}</small></span><span class=pill>${z}/3</span></div>`;P.forEach(([k,n,s])=>{let dis=done(i,k)||a.s[k]>=D.target;h+=`<button class=platform ${dis?'disabled':''} onclick="rec(${i},'${k}')"><span class="ico ${k}">${s}</span><span class=label>${n}</span><b>${a.s[k]} / ${D.target}</b><em>${dis?'✓':'›'}</em></button>`});h+=`<button class="btn outline" style="width:100%;margin-top:8px" onclick="edit(${i})">编辑账号名称 / 密码</button></article>`})}else if(tab==='accounts'){h='<div class=section-head><div><p>账号进度</p><h2>全部账号</h2></div></div>';D.a.forEach((a,i)=>{let p=Math.round(P.reduce((n,[k])=>n+Math.min(a.s[k],D.target),0)/(D.target*3)*100);h+=`<section class=card><div class=acct-top><span class=num>${String(a.id).padStart(2,'0')}</span><span class=name>${a.name}<small>${a.password?'密码已保存':'未填写密码'}</small></span><button class="btn outline" onclick="edit(${i})">编辑</button></div><div class=bar><i style="width:${p}%;background:#1a7657"></i></div><span class=muted>${p}% 完成</span></section>`})}else{h='<div class=section-head><div><p>目标设置</p><h2>截止日前完成囤分</h2></div></div><section class=card><label class=field><span>目标账号数</span><input id=count type=number min=1 value='+D.count+'></label><label class=field><span>截止日期</span><input id=deadline type=date value='+D.deadline+'></label><label class=field><span>每平台目标积分</span><input id=target type=number min=1 value='+D.target+'></label><label class=field><span>每日标准积分</span><input id=daily type=number min=1 value='+D.daily+'></label><button class=btn onclick="apply()">保存目标并生成规划</button><p class=muted>每次点击平台按钮默认增加每日标准积分；密码只保存在当前手机浏览器。</p></section>'}document.querySelector('#app').innerHTML=h}function apply(){D.count=Math.max(1,+count.value);D.deadline=deadline.value;D.target=Math.max(1,+target.value);D.daily=Math.max(1,+daily.value);init();render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#today').textContent=fmt(day());render();</script></html>
