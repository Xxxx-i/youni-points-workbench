<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>由你榜囤分</title><style>body{font:16px system-ui;max-width:640px;margin:auto;padding:20px;background:#f7f3ee;color:#29231f}section{background:#fffaf5;border:1px solid #e5d8cc;border-radius:16px;padding:16px;margin:12px 0}button,input{font:inherit;padding:9px;border-radius:9px;border:1px solid #ddd;margin:4px}button{background:#b45c42;color:white;border:0}.muted{color:#81766d}.account{border-top:1px solid #eee;padding:10px 0}.score{display:inline-block;min-width:70px}</style><h1>由你榜囤分</h1><p class=muted>数据只保存在当前设备浏览器</p><section><b>目标设置</b><p>截止日期 <input id=d type=date value=2026-10-18></p><p>每平台目标 <input id=t type=number value=128></p><button onclick=saveGoal()>保存目标</button></section><div id=a></div><script>let K='youni-netlify-v1',D=JSON.parse(localStorage[K]||'null')||{deadline:'2026-10-18',target:128,accounts:[1,2,3].map(i=>({id:i,name:'账号 '+i,password:'',qq:0,kugou:0,kuwo:0}))};D.accounts=D.accounts.slice(0,3);function save(){localStorage[K]=JSON.stringify(D)}function edit(i){let x=D.accounts[i],n=prompt('账号名称',x.name);if(n===null)return;let p=prompt('账号密码（仅保存在本机）',x.password||'');if(p===null)return;x.name=n||x.name;x.password=p;save();render()}function add(i,k){let x=+prompt('增加积分',14);if(x>0){D.accounts[i][k]+=x;save();render()}}function saveGoal(){D.deadline=d.value;D.target=Math.max(1,+t.value);save();render()}function render(){d.value=D.deadline;t.value=D.target;a.innerHTML=D.accounts.map((x,i)=>`<section class=account><b>${x.name}</b> <button onclick=edit(${i})>编辑名称/密码</button><p class=muted>密码：${x.password?'已保存':'未填写'}</p>${[['qq','QQ音乐'],['kugou','酷狗音乐'],['kuwo','酷我音乐']].map(([k,n])=>`<button onclick="add(${i},'${k}')"><span class=score>${n}</span>${x[k]} / ${D.target}</button>`).join('')}</section>`).join('')}render()</script>
