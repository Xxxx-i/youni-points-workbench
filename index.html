<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>由你榜囤分工作台</title><style>body{font:16px system-ui;margin:auto;max-width:680px;padding:18px;background:#f7f3ee;color:#29231f}section{background:#fffaf5;border:1px solid #e5d8ce;border-radius:16px;padding:15px;margin:12px 0}button,input{font:inherit;padding:9px;border-radius:9px;border:1px solid #ddd;margin:4px}button{background:#b45c42;color:#fff;border:0}.muted{color:#81766d;font-size:13px}.bar{height:9px;background:#eadfd6;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#b45c42}.tabs{display:flex;gap:6px;position:sticky;bottom:0;background:#fffaf5;padding:8px}.tabs button{flex:1;background:#eadbd0;color:#29231f}.row{display:flex;gap:8px;flex-wrap:wrap}.name{display:inline-block;min-width:110px}.platform{width:100%;text-align:left;background:#fff;color:#29231f}.field{display:block;margin:10px 0}.field input{width:100%;box-sizing:border-box}</style><h1>由你榜囤分</h1><p class=muted>目标规划与每日积分记录</p><div id=app></div><nav class=tabs><button onclick="tab='today';render()">首页</button><button onclick="tab='accounts';render()">账号</button><button onclick="tab='settings';render()">设置</button></nav><script>const K='youni-v4',P=[['qq','QQ音乐'],['kg','酷狗音乐'],['kw','酷我音乐']];let D=JSON.parse(localStorage[K]||'null')||{count:18,deadline:'2026-10-18',target:128,daily:14,a:[],h:[]},tab='today';function init(){while(D.a.length<D.count){let i=D.a.length+1;D.a.push({id:i,name:'账号 '+i,password:'',s:{qq:0,kg:0,kw:0}})}D.a=D.a.slice(0,D.count);localStorage[K]=JSON.stringify(D)}init();function days(){return Math.max(1,Math.ceil((new Date(D.deadline)-new Date())/864e5)+1)}function totals(){let goal=D.count*3*D.target,e=D.a.reduce((n,a)=>n+P.reduce((m,[k])=>m+Math.min(D.target,a.s[k]),0),0),q=D.a.filter(a=>P.every(([k])=>a.s[k]>=D.target)).length;return{goal,e,q,p:Math.round(e/goal*100)}}function save(){localStorage[K]=JSON.stringify(D)}function edit(i){let a=D.a[i],n=prompt('账号名称',a.name);if(n===null)return;let p=prompt('账号密码（仅保存在本机）',a.password||'');if(p===null)return;a.name=n.trim()||a.name;a.password=p;save();render()}function rec(i,k){let v=+prompt('本次增加积分',D.daily);if(v>0){D.a[i].s[k]+=v;D.h.push({d:new Date().toISOString().slice(0,10),i,k,v});save();render()}}function render(){let t=totals(),h='';if(tab==='today'){h+=`<section><b>截止 ${D.deadline} 目标</b><h2>${t.e} / ${t.goal} 分（${t.p}%）</h2><div class=bar><i style="width:${Math.min(100,t.p)}%"></i></div><div class=row><span class=muted>剩余 ${days()} 天</span><span class=muted>达标 ${t.q}/${D.count} 个账号</span><span class=muted>每日建议完成 ${Math.max(1,Math.ceil((D.count-t.q)/days()))} 个账号</span></div></section><h3>今日任务</h3>`;D.a.forEach((a,i)=>{h+=`<section><b class=name>${a.name}</b><span class=muted>${a.password?'密码已保存':'未填写密码'}</span> <button onclick=edit(${i})>编辑</button>`;P.forEach(([k,n])=>h+=`<button class=platform onclick="rec(${i},'${k}')">${n}　${a.s[k]} / ${D.target}　›</button>`);h+='</section>'})}else if(tab==='accounts'){h='<h2>账号总览</h2>';D.a.forEach((a,i)=>{let p=Math.round(P.reduce((n,[k])=>n+Math.min(D.target,a.s[k]),0)/(D.target*3)*100);h+=`<section><b>${a.name}</b> <button onclick=edit(${i})>编辑名称/密码</button><div class=bar><i style="width:${p}%"></i></div><p class=muted>${P.map(([k,n])=>n+' '+a.s[k]).join('　')}</p></section>`})}else{h=`<h2>目标设置</h2><section><label class=field>目标账号数<input id=count type=number min=1 value=${D.count}></label><label class=field>截止日期<input id=deadline type=date value=${D.deadline}></label><label class=field>每平台目标积分<input id=target type=number min=1 value=${D.target}></label><label class=field>每日标准积分<input id=daily type=number min=1 value=${D.daily}></label><button onclick=apply()>保存目标并生成规划</button><p class=muted>密码只保存在当前手机浏览器，不上传服务器。</p></section>`}app.innerHTML=h}function apply(){D.count=Math.max(1,+count.value);D.deadline=deadline.value;D.target=Math.max(1,+target.value);D.daily=Math.max(1,+daily.value);init();save();render()}render()</script>
