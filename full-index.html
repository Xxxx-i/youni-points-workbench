<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>由你榜囤分工作台</title><style>body{margin:0;background:#f7f3ee;color:#29231f;font:16px system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:680px;margin:auto;padding:20px 15px 86px}.top{display:flex;justify-content:space-between;align-items:center}.ey{font-size:12px;letter-spacing:.15em;color:#b45c42;margin:0}.top h1{margin:4px 0 0;font-size:28px}.date{background:#eadbd0;padding:8px 12px;border-radius:18px}.card,.acct{background:#fffaf5;border:1px solid #e4d8ce;border-radius:18px;padding:16px;margin:14px 0}.goal{display:flex;justify-content:space-between;align-items:center}.big{font-size:30px;font-weight:750;margin:3px 0}.muted{color:#81766d;font-size:13px}.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#b45c42 var(--p),#eadfd6 0)}.ring:after{content:"";position:absolute;width:50px;height:50px;border-radius:50%;background:#fffaf5}.ring span{z-index:1;font-weight:700}.bar{height:9px;background:#eadfd6;border-radius:8px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:#b45c42}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.stats b{display:block;font-size:21px}.stats span{font-size:12px;color:#81766d}.head{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 8px}.head h2{font-size:19px;margin:2px 0}.head p{font-size:13px;color:#81766d;margin:0}.acct-top{display:flex;align-items:center;gap:10px}.num{background:#eadbd0;border-radius:9px;padding:7px 9px;font-weight:700}.name{flex:1}.pill{font-size:12px;color:#81766d;background:#eadfd6;border-radius:12px;padding:4px 8px}.pill.ok{color:#37765c;background:#dcece3}.platform{width:100%;padding:10px;border:1px solid #e6ddd5;background:#fff;border-radius:10px;margin-top:8px;text-align:left;font:inherit;display:flex;gap:8px}.platform:disabled{opacity:.6}.platform span:nth-child(2){flex:1}.platform b{font-weight:500}.qq{color:#477dcc}.kg{color:#d76e3b}.kw{color:#4e87b6}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:flex;background:#fffaf5ee;border-top:1px solid #e4d8ce;padding:9px 12px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav button{flex:1;border:0;background:none;padding:9px;color:#81766d;font:inherit}.nav button.active{background:#eadbd0;border-radius:11px;color:#29231f}.btn{border:0;border-radius:9px;padding:9px 12px;background:#b45c42;color:white;font:inherit}.outline{background:white;color:#29231f;border:1px solid #ddd}.row{display:flex;gap:8px;flex-wrap:wrap}.field{display:block;margin:12px 0}.field span{display:block;color:#81766d;font-size:13px}.field input{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;font:inherit;box-sizing:border-box}.hide{display:none}</style><main><header class=top><div><p class=ey>YOU CHART · DAILY</p><h1>由你榜囤分</h1></div><div class=date id=today></div></header><div id=app></div></main><nav class=nav><button data-tab=today class=active>今天</button><button data-tab=accounts>账号</button><button data-tab=settings>设置</button></nav><script>
const K='youni-full-v2',P=[['qq','QQ音乐','Q'],['kg','酷狗音乐','狗'],['kw','酷我音乐','我']],day=()=>new Date().toISOString().slice(0,10);let D=JSON.parse(localStorage[K]||'null')||{deadline:'2026-10-18',target:128,daily:14,accounts:[1,2,3].map(i=>({id:i,name:'账号 '+i,password:'',s:{qq:0,kg:0,kw:0}})),h:[]};D.accounts=D.accounts.slice(0,3).map(a=>({...a,password:a.password||'',s:a.s||{qq:0,kg:0,kw:0}}));let tab='today';const save=()=>localStorage[K]=JSON.stringify(D),fmt=x=>{let d=new Date(x+'T00:00:00');return d.getMonth()+1+'月'+d.getDate()+'日'},left=()=>Math.max(1,Math.ceil((new Date(D.deadline)-new Date(day()))/864e5)+1);document.querySelector('#today').textContent=fmt(day());function edit(i){let a=D.accounts[i],n=prompt('修改账号名称',a.name);if(n===null)return;let p=prompt('保存账号密码（仅本机）',a.password||'');if(p===null)return;a.name=n.trim()||a.name;a.password=p;save();render()}function rec(i,k){if(D.h.some(x=>x.d===day()&&x.i===i&&x.k===k))return;let n=+prompt('本次增加积分',D.daily);if(!n||n<1)return;D.accounts[i].s[k]+=n;D.h.push({d:day(),i,k,n});save();render()}function totals(){let goal=D.accounts.length*3*D.target,earned=D.accounts.reduce((n,a)=>n+P.reduce((m,[k])=>m+Math.min(a.s[k],D.target),0),0),q=D.accounts.filter(a=>P.every(([k])=>a.s[k]>=D.target)).length;return{goal,earned,q,p:Math.min(100,Math.round(earned/goal*100))}}function render(){let t=totals(),h='';if(tab==='today'){h+=`<section class=card><div class=goal><div><p class=muted>${fmt(D.deadline)} 白金单曲目标</p><div class=big>${t.earned.toLocaleString()} <small class=muted>/ ${t.goal.toLocaleString()} 分</small></div></div><div class=ring style="--p:${t.p*3.6}deg"><span>${t.p}%</span></div></div><div class=bar><i style="width:${t.p}%"></i></div><div class=stats><div><b>${left()}</b><span>剩余天数</span></div><div><b>${t.q}/3</b><span>达标账号</span></div><div><b>${Math.max(1,Math.ceil((3-t.q)/left()))}</b><span>每日建议</span></div></div></section><div class=head><div><p>今天的任务</p><h2>三平台积分记录</h2></div></div>`;D.accounts.forEach((a,i)=>{let done=P.filter(([k])=>a.s[k]>=D.target||D.h.some(x=>x.d===day()&&x.i===i&&x.k===k)).length;h+=`<article class=acct><div class=acct-top><span class=num>账号 ${a.id}</span><span class=name><b>${a.name}</b><small class=muted>　${a.password?'密码已保存':'未填写密码'}</small></span><span class="pill ${done===3?'ok':''}">${done}/3</span></div>`;P.forEach(([k,n,s])=>{let dis=a.s[k]>=D.target||D.h.some(x=>x.d===day()&&x.i===i&&x.k===k);h+=`<button class=platform ${dis?'disabled':''} onclick="rec(${i},'${k}')"><span class=${k}>${s}</span><span>${n}</span><b>${a.s[k]} / ${D.target}</b><span>${dis?'✓':'›'}</span></button>`});h+=`<button class="btn" style="width:100%;margin-top:9px" onclick="edit(${i})">编辑账号名称 / 密码</button></article>`})}else if(tab==='accounts'){h='<div class=head><div><p>账号进度</p><h2>账号 1–3 总览</h2></div></div>';D.accounts.forEach((a,i)=>{let p=Math.round(P.reduce((n,[k])=>n+Math.min(a.s[k],D.target),0)/(D.target*3)*100);h+=`<section class=card><div class=acct-top><span class=num>${a.id}</span><span class=name><b>${a.name}</b><small class=muted>　${a.password?'密码已保存':'未填写密码'}</small></span><button class="btn outline" onclick="edit(${i})">编辑</button></div><div class=bar><i style="width:${p}%"></i></div><div class=row>${P.map(([k,n,s])=>`<span class=pill>${s} ${a.s[k]}</span>`).join('')}</div></section>`})}else{h=`<div class=head><div><p>目标设置</p><h2>截止日前完成囤分</h2></div></div><section class=card><label class=field><span>截止日期</span><input id=deadline type=date value=${D.deadline}></label><label class=field><span>每平台目标积分</span><input id=target type=number value=${D.target} min=1></label><label class=field><span>每日标准积分</span><input id=daily type=number value=${D.daily} min=1></label><div class=row><button class=btn onclick="settingsSave()">保存目标</button><button class="btn outline" onclick="backup()">导出备份</button><button class="btn outline" onclick="restore()">导入备份</button></div><p class=muted>账号密码只保存在当前手机浏览器，不上传服务器。</p></section>`}document.querySelector('#app').innerHTML=h}function settingsSave(){D.deadline=deadline.value;D.target=Math.max(1,+target.value);D.daily=Math.max(1,+daily.value);save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='由你榜囤分备份.json';a.click()}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(x=>{try{D=JSON.parse(x);D.accounts=D.accounts.slice(0,3);save();render()}catch{alert('备份文件格式不正确')}});i.click()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});render();</script></html>
